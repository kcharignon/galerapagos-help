version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
  # L'application Android (android/) : plugins et bibliothèques de Gradle, en une seule proposition à la fois.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
    ignore:
      # Les montées majeures (AGP, Kotlin, Compose) se font à la main : elles vont ensemble.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /android
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
